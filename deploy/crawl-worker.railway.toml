# Railway config: crawl worker
# Config path in Railway dashboard: deploy/crawl-worker.railway.toml
#
# Polls crawl:companies queue, crawls ATS career pages,
# pushes results to score:jobs and enrich:jobs queues.

[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "python -m workers.crawl"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 5
