# Railway config: fetch cron job (short-lived)
# Config path in Railway dashboard: deploy/fetch-cron.railway.toml
#
# Runs daily at 6 AM UTC. Hits the API's internal fetch endpoint to
# enqueue a fetch:jobs task per active user, then exits.
# Reuses the backend Docker image (curl is available in the base image).

[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "sh -c 'curl -sf -X POST -H \"X-Internal-API-Key: $INTERNAL_API_KEY\" $API_URL/api/internal/scheduler/fetch'"
cronSchedule = "0 6 * * *"
