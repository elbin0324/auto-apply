# Railway config: stale application reaper cron job (short-lived)
# Config path in Railway dashboard: deploy/reaper-cron.railway.toml
#
# Runs every 5 minutes. Hits the API's internal reap-stale endpoint to
# mark stuck queued/in_progress applications as failed, then exits.
# Reuses the backend Docker image (curl is available in the base image).

[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "sh -c 'curl -sf -X POST -H \"X-Internal-API-Key: $INTERNAL_API_KEY\" $API_URL/api/internal/scheduler/reap-stale'"
cronSchedule = "*/5 * * * *"
