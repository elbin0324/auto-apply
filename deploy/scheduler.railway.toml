# Railway config: arq scheduler (cron-based task dispatcher)
# Config path in Railway dashboard: deploy/scheduler.railway.toml
#
# Dispatches periodic tasks: crawl scheduling, user re-scoring,
# job re-matching, enrichment scheduling, Adzuna sync.

[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "arq worker.WorkerSettings"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 5
