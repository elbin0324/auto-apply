# Railway deployment configs live in deploy/*.railway.toml
#
# Each Railway service should point to its own config file:
#
#   Service          Config Path (set in Railway dashboard)
#   ──────────────   ──────────────────────────────────────
#   api              deploy/api.railway.toml
#   scheduler        deploy/scheduler.railway.toml
#   crawl-worker     deploy/crawl-worker.railway.toml
#   score-worker     deploy/score-worker.railway.toml
#   enrich-worker    deploy/enrich-worker.railway.toml
#
# All services share the same Dockerfile (backend/Dockerfile).
# Shared env vars should be promoted to Railway shared variables.
#
# This root file is kept as the default for the API service.

[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 5
